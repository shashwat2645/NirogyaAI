{% extends "base.html" %}
{% block title %}Home{% endblock title %}
{% block body %}

<section class="py-5">
      <div class="container">
        <div class="row g-4">
          <!-- Contact Info -->
          <div class="col-lg-5">
            <div class="card h-100 border-0 shadow-sm">
              <div class="card-body">
                <h2 class="fw-bold mb-4">Get in Touch</h2>
                <p class="text-muted">
                  We’d love to hear from you! Reach out using the info below or
                  send us a message.
                </p>
                <ul class="list-unstyled mt-4">
                  <li class="mb-3">
                    <i class="bi bi-envelope-fill me-2 text-primary"></i>
                    <a
                      href="mailto:support@nirogyaai.com"
                      class="text-decoration-none"
                      >support@nirogyaai.com</a
                    >
                  </li>
                  <li class="mb-3">
                    <i class="bi bi-telephone-fill me-2 text-primary"></i>
                    <a href="tel:+919876543210" class="text-decoration-none"
                      >+91 98765 43210</a
                    >
                  </li>
                  <li>
                    <i class="bi bi-geo-alt-fill me-2 text-primary"></i>
                    Lucknow, Uttar Pradesh, India
                  </li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Contact Form -->
          <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
              <div class="card-body">
                <h2 class="fw-bold mb-4">Contact Form</h2>
                <form>
                  <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      placeholder="Enter your full name"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="name@example.com"
                    />
                  </div>
                  <div class="mb-3">
                    <label for="message" class="form-label">Your Message</label>
                    <textarea
                      class="form-control"
                      id="message"
                      rows="5"
                      placeholder="Type your message here..."
                    ></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary px-4">
                    Send Message
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

{% endblock body %}
