<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup - NirogyaAI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        /* background: #e3f2fd;  */
        background: url('bg.jpeg');
        background-repeat: no-repeat;
        background-size: cover;
      }
      body::before{
        content: "";
        position: absolute;
        top: 0;left: 0;right: 0;bottom: 0;
        background: inherit;
        z-index: -1;
        filter: blur(3px);
      }
      .form-container {
        max-width: 450px;
        margin: 60px auto;
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      }
      .toggle-btns {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
      }
      .toggle-btns button {
        flex: 1;
        border-radius: 0;
      }
      .toggle-btns .active {
        background: #28a745;
        color: #fff;
      }
      .form-control:focus {
        border-color: #28a745;
        box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
      }
      .form-title {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #2d6a4f;
      }
      .required::after {
        content: " *";
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <!-- Toggle buttons -->
      <div class="toggle-btns btn-group">
        <button id="loginBtn" class="btn btn-outline-success active">
          Login
        </button>
        <button id="signupBtn" class="btn btn-outline-success">Signup</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" method="post" action="/login">
        {% csrf_token %}
        <h3 class="form-title">Login</h3>
        <div class="mb-3">
          <label class="form-label required">Email</label>
          <input
            type="email"
            name="email"
            id="loginEmail"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Password</label>
          <input
            type="password"
            name="password"
            id="loginPassword"
            class="form-control"
            placeholder="Enter your password"
            required
          />
        </div>
        <button type="submit" class="btn btn-success w-100">Login</button>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" style="display: none"  method="post" action="/login">
        {% csrf_token %}
        <h3 class="form-title">Signup</h3>
        <div class="mb-3">
          <label class="form-label required">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-control"
            placeholder="Enter your name"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Age</label>
          <input
            type="number"
            id="age"
            name="age"
            class="form-control"
            placeholder="Enter your age"
            required
            min="1"
            max="120"
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Phone</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            class="form-control"
            placeholder="Enter your phone number"
            required
            pattern="[0-9]{10}"
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Email</label>
          <input
            type="email"
            name="email"
            id="signupEmail"
            class="form-control"
            placeholder="Enter your email"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Gender</label>
          <div>
            <label class="me-3">
              <input type="radio" name="gender" value="Male" required /> Male
            </label>
            <label class="me-3">
              <input type="radio" name="gender" value="Female" /> Female
            </label>
            <label>
              <input type="radio" name="gender" value="Other" /> Other
            </label>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label required">Password</label>
          <input
            type="password"
            id="password"
            name="password1"
            class="form-control"
            placeholder="Create a password"
            required
            minlength="6"
          />
        </div>
        <div class="mb-3">
          <label class="form-label required">Retype Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="passoword2"
            class="form-control"
            placeholder="Retype password"
            required
          />
        </div>
        <button type="submit" class="btn btn-success w-100">Signup</button>
      </form>
    </div>

    <script>
      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");
      const loginForm = document.getElementById("loginForm");
      const signupForm = document.getElementById("signupForm");

      // Toggle forms
      loginBtn.addEventListener("click", () => {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
        loginBtn.classList.add("active");
        signupBtn.classList.remove("active");
      });

      signupBtn.addEventListener("click", () => {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
        signupBtn.classList.add("active");
        loginBtn.classList.remove("active");
      });

      // Login validation
      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value.trim();

        if (!email.includes("@")) {
          alert("Please enter a valid email.");
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters.");
          return;
        }
        alert("Login successful!");
      });

      // Signup validation
      signupForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("name").value.trim();
        const age = document.getElementById("age").value;
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("signupEmail").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (name.length < 2) {
          alert("Name must be at least 2 characters long.");
          return;
        }
        if (age < 1 || age > 120) {
          alert("Please enter a valid age.");
          return;
        }
        if (!/^[0-9]{10}$/.test(phone)) {
          alert("Phone number must be 10 digits.");
          return;
        }
        if (!email.includes("@")) {
          alert("Please enter a valid email.");
          return;
        }
        if (password.length < 6) {
          alert("Password must be at least 6 characters.");
          return;
        }
        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return;
        }
        alert("Signup successful!");
      });
    </script>
  </body>
</html>
